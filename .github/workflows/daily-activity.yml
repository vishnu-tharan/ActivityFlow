name: Daily Automated Activity

on:
  schedule:
    # 9:30 AM UTC corresponds to 3:00 PM IST (Indian Standard Time)
    - cron: '30 9 * * *'
  workflow_dispatch: # Allows you to manually trigger the workflow from the Actions tab

jobs:
  daily-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required so the action can push the commit back to the repository
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Multiple Commits
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Generate a random number of commits between 12 and 16
          NUM_COMMITS=$(( (RANDOM % 5) + 12 ))
          
          for i in $(seq 1 $NUM_COMMITS); do
            echo "- Automated activity update (Commit $i of $NUM_COMMITS) on $(date)" >> daily_activity.md
            git add daily_activity.md
            git commit -m "Automated activity record #$i"
          done
          
          git push
